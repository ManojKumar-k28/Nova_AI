services:
  api1:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    volumes:
      - nova_uploads:/app/uploads
      - nova_temp:/app/temp
    restart: unless-stopped

  api2:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    volumes:
      - nova_uploads:/app/uploads
      - nova_temp:/app/temp
    restart: unless-stopped

  api3:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    volumes:
      - nova_uploads:/app/uploads
      - nova_temp:/app/temp
    restart: unless-stopped

  load-balancer:
    image: nginx:1.27-alpine
    depends_on:
      - api1
      - api2
      - api3
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  nova_uploads:
  nova_temp:
